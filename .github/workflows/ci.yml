name: GenyConnect Android CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.2.3"
  QT_VERSION: "6.11.0"
  ANDROID_API: "28"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  android:
    name: Build Android arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Save Qt paths
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_QT_ROOT=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "QT_HOST_ROOT=$(dirname "${QT_ROOT_DIR}")/gcc_64" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install Linux tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip zip p7zip-full curl file

      - name: Print toolchain info
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_QT_ROOT=${ANDROID_QT_ROOT}"
          echo "QT_HOST_ROOT=${QT_HOST_ROOT}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT}"

          test -f "${ANDROID_QT_ROOT}/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "${ANDROID_QT_ROOT}/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "${QT_HOST_ROOT}/lib/cmake/Qt6/Qt6Config.cmake"
          test -x "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-scan-deps"

      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="${ANDROID_QT_ROOT}" \
            -DQt6_DIR="${ANDROID_QT_ROOT}/lib/cmake/Qt6" \
            -DQT_HOST_PATH="${QT_HOST_ROOT}" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_QT_ROOT}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_CXX_SCAN_FOR_MODULES=ON \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-scan-deps" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_STL="c++_shared" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DGENYCONNECT_BUILD_DESKTOP=OFF \
            -DGENYCONNECT_BUILD_ANDROID=ON \
            -DGENYCONNECT_ENABLE_MOBILE_VPN=ON \
            -DGENYCONNECT_USE_MODULES=ON \
            -DGENYCONNECT_AUTO_DOWNLOAD_XRAY=OFF \
            -DGENYCONNECT_TARGET_OS=android \
            -DGENYCONNECT_TARGET_ARCH=arm64 \
            -DGENYCONNECT_TARGET_BUILD_ARCH=arm64

      - name: Build Android
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Debug --parallel

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Debug --target apk --parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GenyConnect-android-arm64-v8a-debug
          path: |
            build/**/*.apk