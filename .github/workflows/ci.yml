name: GenyConnect CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CMAKE_VERSION: "4.2.3"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  desktop:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: GenyConnect-macos-arm64
            os: macos-14
            qt_version: "6.11.0"
            qt_arch: clang_64
            target_arch: arm64
            macos_deployment_target: "14.0"

          - artifact_name: GenyConnect-macos-x86_64
            os: macos-15-intel
            qt_version: "6.11.0"
            qt_arch: clang_64
            target_arch: x86_64
            macos_deployment_target: "14.0"

          - artifact_name: GenyConnect-windows-x64
            os: windows-2022
            qt_version: "6.10.3"
            qt_arch: win64_msvc2022_64
            cmake_arch: x64
            target_arch: x86_64

          - artifact_name: GenyConnect-windows-arm64
            os: windows-11-arm
            qt_version: "6.10.3"
            qt_arch: win64_msvc2022_arm64
            cmake_arch: ARM64
            target_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja llvm

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y ninja nsis 7zip

      - name: Configure LLVM on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          LLVM_PREFIX="$(brew --prefix llvm)"

          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"
          echo "CLANG_SCAN_DEPS=${LLVM_PREFIX}/bin/clang-scan-deps" >> "$GITHUB_ENV"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=${SDKROOT}" >> "$GITHUB_ENV"

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.cmake_arch }}

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DQt6_DIR="${QT_ROOT_DIR}/lib/cmake/Qt6" \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=ON \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="${CLANG_SCAN_DEPS}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.macos_deployment_target }}" \
            -DGENYCONNECT_MACOS_DEPLOYMENT_TARGET="${{ matrix.macos_deployment_target }}" \
            -DGENYCONNECT_USE_MODULES=ON \
            -DGENYCONNECT_LLVM_AUTO_SCAN=ON \
            -DGENYCONNECT_TARGET_ARCH="${{ matrix.target_arch }}" \
            -DGENYCONNECT_TARGET_BUILD_ARCH="${{ matrix.target_arch }}" \
            -DGENYCONNECT_MACOS_CODESIGN=ON \
            -DGENYCONNECT_CODESIGN_IDENTITY="-"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A "${{ matrix.cmake_arch }}" `
            -DCMAKE_CONFIGURATION_TYPES="Release" `
            -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}" `
            -DQt6_DIR="${env:QT_ROOT_DIR}/lib/cmake/Qt6" `
            -DCMAKE_CXX_STANDARD=23 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_SCAN_FOR_MODULES=ON `
            -DGENYCONNECT_USE_MODULES=ON `
            -DGENYCONNECT_TARGET_ARCH="${{ matrix.target_arch }}" `
            -DGENYCONNECT_TARGET_BUILD_ARCH="${{ matrix.target_arch }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP="build/bin/GenyConnect.app"

          for f in \
            "$APP/Contents/MacOS/GenyConnect" \
            "$APP/Contents/MacOS/GenyConnectUpdater" \
            "$APP/Contents/MacOS/GenyConnectTunHelper"
          do
            echo
            echo "==== $f ===="
            otool -l "$f" | grep -A5 LC_BUILD_VERSION || true

            if otool -l "$f" | grep -A5 LC_BUILD_VERSION | grep -q "minos 26."; then
              echo "ERROR: $f was built with macOS 26.x minimum target."
              exit 1
            fi
          done

      - name: Re-sign macOS app ad-hoc and create DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          APP="build/bin/GenyConnect.app"
          OUT_DIR="build/final/macos-${{ matrix.target_arch }}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E 'project\(\$\{PROJECT_NAME\} VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi

          mkdir -p "$OUT_DIR"
          DMG_PATH="${OUT_DIR}/GenyConnect-${VERSION}-macos-${{ matrix.target_arch }}.dmg"

          hdiutil detach "/Volumes/GenyConnect" -force || true
          rm -f "$DMG_PATH"
          sleep 2

          xattr -cr "$APP" || true

          chmod +x "$APP/Contents/MacOS/GenyConnect" || true
          chmod +x "$APP/Contents/MacOS/GenyConnectUpdater" || true
          chmod +x "$APP/Contents/MacOS/GenyConnectTunHelper" || true
          chmod +x "$APP/Contents/MacOS/xray-core" || true

          codesign --remove-signature "$APP" || true

          while IFS= read -r file_path; do
            if file "$file_path" | grep -q "Mach-O"; then
              codesign --force --sign - "$file_path" || true
            fi
          done < <(find "$APP/Contents" -type f)

          while IFS= read -r framework_path; do
            codesign --force --sign - "$framework_path" || true
          done < <(find "$APP/Contents" -type d -name "*.framework" | sort -r)

          while IFS= read -r bundle_path; do
            codesign --force --sign - "$bundle_path" || true
          done < <(find "$APP/Contents" \( -name "*.bundle" -o -name "*.plugin" -o -name "*.appex" \) -type d | sort -r)

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"

          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/GenyConnect.app"
          ln -s /Applications "$STAGING/Applications"

          hdiutil detach "/Volumes/GenyConnect" -force || true
          sleep 2

          hdiutil create \
            -volname "GenyConnect" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_PATH"

          rm -rf "$STAGING"
          hdiutil verify "$DMG_PATH"

      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          DMG="$(find build/final -type f -name "*.dmg" | head -n 1)"

          if [[ -z "$DMG" ]]; then
            echo "No DMG found."
            exit 1
          fi

          hdiutil verify "$DMG"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release

      - name: Create desktop self-update assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/selfupdate

          ARCH="${{ matrix.target_arch }}"
          if [[ "${ARCH}" == "x86_64" ]]; then
            ARCH="x64"
          fi

          case "${{ runner.os }}" in
            macOS)
              PLATFORM="macos"
              EXT="dmg"
              SRC="$(find build/final -type f -name "*.dmg" | head -n 1)"
              ;;

            Windows)
              PLATFORM="windows"
              EXT="exe"
              SRC="$(find build -type f -name "GenyConnect.exe" | grep -E "Release|bin" | head -n 1 || true)"

              if [[ -z "${SRC}" ]]; then
                SRC="$(find build/final -type f -name "*.exe" | grep -Evi 'setup|installer|install|nsis|inno' | head -n 1 || true)"
              fi
              ;;
          esac

          if [[ -z "${SRC:-}" || ! -f "${SRC}" ]]; then
            echo "No self-update source asset found."
            find build -maxdepth 8 -type f | sort | tail -300
            exit 1
          fi

          OUT="build/selfupdate/GenyConnect-selfupdate-${PLATFORM}-${ARCH}.${EXT}"
          cp "${SRC}" "${OUT}"

          (
            cd build/selfupdate
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$(basename "${OUT}")" > "$(basename "${OUT}").sha256"
            else
              shasum -a 256 "$(basename "${OUT}")" > "$(basename "${OUT}").sha256"
            fi
          )

          ls -lah build/selfupdate

      - name: Collect desktop packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find build/final -type f -name "*.dmg" -exec cp {} artifacts/ \; || true
          find build/final -type f -name "*.zip" -exec cp {} artifacts/ \; || true
          find build/final -type f -name "*.exe" -exec cp {} artifacts/ \; || true
          find build/selfupdate -type f -name "GenyConnect-selfupdate-*" -exec cp {} artifacts/ \; || true

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No desktop artifacts found."
            find build -maxdepth 8 -type f | sort | tail -300
            exit 1
          fi

          ls -lah artifacts

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*

  linux-x64:
    name: Build GenyConnect-linux-x86_64
    runs-on: ubuntu-latest

    container:
      # Keep x86_64 on the same Qt release as ARM64. Installing the official
      # Qt archive below avoids silently packaging the older Qt from a build image.
      image: ubuntu:22.04
      options: --user 0

    env:
      QT_VERSION: "6.11.0"
      TARGET_ARCH: x86_64
      APPIMAGE_ARCH: x86_64
      SELFUPDATE_ARCH: x64
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux x64 toolchain
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y \
            locales python3 python3-pip rpm \
            wget curl gnupg lsb-release software-properties-common ca-certificates \
            unzip zip file tar gzip patchelf desktop-file-utils fakeroot fuse libfuse2 imagemagick \
            libgl1 libgl1-mesa-dev libegl1 libegl1-mesa-dev \
            libxkbcommon0 libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev \
            libxcb1 libxcb1-dev libxcb-cursor0 libxcb-cursor-dev libxcb-icccm4 libxcb-icccm4-dev \
            libxcb-image0 libxcb-image0-dev libxcb-keysyms1 libxcb-keysyms1-dev \
            libxcb-render-util0 libxcb-render-util0-dev libxcb-shape0 libxcb-shape0-dev \
            libxcb-xfixes0 libxcb-xfixes0-dev libfontconfig1 libfontconfig1-dev \
            libfreetype6 libfreetype6-dev libglib2.0-0 libglib2.0-dev \
            libharfbuzz0b libharfbuzz-dev libpng16-16 libpng-dev zsync

          locale-gen C.UTF-8 || true
          update-locale LANG=C.UTF-8 || true

          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 18

          apt-get install -y clang-18 clang-tools-18 lld-18 llvm-18 ninja-build

          NINJA_VERSION="1.13.1"
          wget -O /tmp/ninja-linux.zip "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          unzip -o /tmp/ninja-linux.zip -d /usr/local/bin
          chmod +x /usr/local/bin/ninja

          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "CC=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-18" >> "$GITHUB_ENV"
          echo "CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-18" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install Qt Linux x64
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user aqtinstall

          export PATH="${HOME}/.local/bin:${PATH}"
          aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -O "${HOME}/Qt"

          QT_CONFIG="$(find "${HOME}/Qt" -type f -path "*/lib/cmake/Qt6/Qt6Config.cmake" | head -n 1)"
          if [[ -z "${QT_CONFIG}" || ! -f "${QT_CONFIG}" ]]; then
            echo "Qt x64 install failed."
            exit 1
          fi

          QT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "${QT_CONFIG}")")")")"
          echo "QT_ROOT_DIR=${QT_ROOT}" >> "$GITHUB_ENV"
          echo "${QT_ROOT}/bin" >> "$GITHUB_PATH"

          QMAKE_VERIFY="${QT_ROOT}/bin/qmake6"
          if [[ ! -x "${QMAKE_VERIFY}" ]]; then
            QMAKE_VERIFY="${QT_ROOT}/bin/qmake"
          fi
          if [[ ! -x "${QMAKE_VERIFY}" ]]; then
            echo "qmake was not installed with Qt ${QT_VERSION}."
            exit 1
          fi

          ACTUAL_QT_VERSION="$("${QMAKE_VERIFY}" -query QT_VERSION)"
          if [[ "${ACTUAL_QT_VERSION}" != "${QT_VERSION}" ]]; then
            echo "Expected Qt ${QT_VERSION}, found ${ACTUAL_QT_VERSION}."
            exit 1
          fi

      - name: Configure Linux x64
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DQt6_DIR="${QT_ROOT_DIR}/lib/cmake/Qt6" \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="${CLANG_SCAN_DEPS}" \
            -DGENYCONNECT_USE_MODULES=ON \
            -DGENYCONNECT_LLVM_AUTO_SCAN=ON \
            -DGENYCONNECT_TARGET_OS=linux \
            -DGENYCONNECT_TARGET_ARCH="${TARGET_ARCH}" \
            -DGENYCONNECT_TARGET_BUILD_ARCH="${TARGET_ARCH}" \
            -DGENYCONNECT_LINUX_INSTALL_DEPLOY=OFF

      - name: Build Linux x64
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel

      - name: Create and verify Linux x64 RPM
        shell: bash
        run: |
          set -euo pipefail

          cpack --config build/CPackConfig.cmake -G RPM
          RPM_PACKAGE="$(find "build/final/linux-${TARGET_ARCH}" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "${RPM_PACKAGE}"
          test -f "${RPM_PACKAGE}"

          rpm -qip "${RPM_PACKAGE}"
          rpm -qpl "${RPM_PACKAGE}" | tee /tmp/genyconnect-rpm-files.txt
          for required_path in \
            /usr/bin/GenyConnect \
            /usr/bin/GenyConnectUpdater \
            /usr/bin/GenyConnectTunHelper \
            /usr/bin/xray-core \
            /usr/share/applications/genyconnect.desktop \
            /usr/share/icons/hicolor/512x512/apps/genyconnect.png; do
            grep -Fqx "${required_path}" /tmp/genyconnect-rpm-files.txt
          done

      - name: Create Linux x64 AppImage
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E 'project\(\$\{PROJECT_NAME\} VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi

          OUT_DIR="build/final/linux-${TARGET_ARCH}"
          mkdir -p "${OUT_DIR}"

          rm -rf AppDir tools
          mkdir -p AppDir tools

          DESTDIR="${PWD}/AppDir" cmake --install build --config Release --prefix /usr

          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          if [[ ! -f AppDir/usr/share/applications/genyconnect.desktop ]]; then
            printf '%s\n' \
              '[Desktop Entry]' \
              'Type=Application' \
              'Name=GenyConnect' \
              'Comment=GenyConnect VPN Client' \
              'Exec=GenyConnect' \
              'Icon=genyconnect' \
              'Terminal=false' \
              'Categories=Network;Qt;' \
              > AppDir/usr/share/applications/genyconnect.desktop
          fi

          if [[ -f ui/Resources/image/GenyConnect.png ]]; then
            if command -v magick >/dev/null 2>&1; then
              magick ui/Resources/image/GenyConnect.png -resize 512x512! AppDir/usr/share/icons/hicolor/512x512/apps/genyconnect.png
            else
              convert ui/Resources/image/GenyConnect.png -resize 512x512! AppDir/usr/share/icons/hicolor/512x512/apps/genyconnect.png
            fi
          fi

          chmod +x AppDir/usr/bin/GenyConnect || true
          chmod +x AppDir/usr/bin/GenyConnectTunHelper || true
          chmod +x AppDir/usr/bin/GenyConnectUpdater || true
          chmod +x AppDir/usr/bin/xray-core || true

          wget -O tools/linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${APPIMAGE_ARCH}.AppImage"
          wget -O tools/linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${APPIMAGE_ARCH}.AppImage"

          chmod +x tools/linuxdeploy.AppImage tools/linuxdeploy-plugin-qt.AppImage

          QMAKE_BIN="${QT_ROOT_DIR}/bin/qmake6"
          if [[ ! -x "${QMAKE_BIN}" ]]; then
            QMAKE_BIN="${QT_ROOT_DIR}/bin/qmake"
          fi
          if [[ -z "${QMAKE_BIN}" || ! -x "${QMAKE_BIN}" ]]; then
            echo "qmake/qmake6 not found."
            exit 1
          fi

          QT_PREFIX="$("${QMAKE_BIN}" -query QT_INSTALL_PREFIX)"
          QT_LIB_DIR="$("${QMAKE_BIN}" -query QT_INSTALL_LIBS)"
          QT_PLUGIN_DIR="$("${QMAKE_BIN}" -query QT_INSTALL_PLUGINS)"
          export LD_LIBRARY_PATH="${QT_LIB_DIR}:${QT_PREFIX}/lib:${LD_LIBRARY_PATH:-}"

          mkdir -p AppDir/usr/plugins/platforms AppDir/usr/plugins/imageformats
          cp -av "${QT_PLUGIN_DIR}/platforms/libqxcb.so" AppDir/usr/plugins/platforms/ || true
          cp -av "${QT_PLUGIN_DIR}"/platforms/libqwayland*.so AppDir/usr/plugins/platforms/ || true
          cp -av "${QT_PLUGIN_DIR}/imageformats/libqsvg.so" AppDir/usr/plugins/imageformats/ || true

          if [[ ! -f "AppDir/usr/plugins/platforms/libqxcb.so" ]]; then
            echo "ERROR: Qt xcb platform plugin is required but was not found under ${QT_PLUGIN_DIR}/platforms."
            find "${QT_PLUGIN_DIR}/platforms" -maxdepth 1 -type f -print || true
            exit 1
          fi

          if ! compgen -G "AppDir/usr/plugins/platforms/libqwayland*.so" >/dev/null; then
            echo "WARNING: Qt Wayland platform plugins were not found under ${QT_PLUGIN_DIR}/platforms."
            echo "Continuing with xcb-only AppImage for this architecture."
            find "${QT_PLUGIN_DIR}/platforms" -maxdepth 1 -type f -print || true
          fi

          export QMAKE="${QMAKE_BIN}"
          export QML_SOURCES_PATHS="${PWD}/ui"
          export EXTRA_QT_PLUGINS="platforms/libqxcb.so,platforms/libqwayland-egl.so,platforms/libqwayland-generic.so,imageformats/libqsvg.so"
          export OUTPUT="GenyConnect-${VERSION}-linux-${TARGET_ARCH}.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./tools/linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/genyconnect.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/genyconnect.png \
            --plugin qt \
            --output appimage

          test -f "${OUTPUT}"
          mv "${OUTPUT}" "${OUT_DIR}/${OUTPUT}"
          (
            cd "${OUT_DIR}"
            sha256sum "GenyConnect-${VERSION}-linux-${TARGET_ARCH}.AppImage" \
              > "GenyConnect-${VERSION}-linux-${TARGET_ARCH}.AppImage.sha256"
          )

          ls -lah "${OUT_DIR}"

      - name: Verify Linux x64 AppImage
        shell: bash
        run: |
          set -euo pipefail

          APPIMAGE="$(find build/final -type f -name "*.AppImage" | head -n 1)"
          test -f "${APPIMAGE}"
          chmod +x "${APPIMAGE}"

          rm -rf /tmp/genyconnect-appimage-check
          mkdir -p /tmp/genyconnect-appimage-check
          cp "${APPIMAGE}" /tmp/genyconnect-appimage-check/
          cd /tmp/genyconnect-appimage-check

          "./$(basename "${APPIMAGE}")" --appimage-extract >/dev/null

          : > /tmp/genyconnect-linux-x64-ldd.txt
          for name in GenyConnect GenyConnectTunHelper GenyConnectUpdater xray-core; do
            BIN="$(find squashfs-root -type f -name "${name}" | head -n 1 || true)"
            if [[ -z "${BIN}" ]]; then
              if [[ "${name}" == "xray-core" ]]; then
                continue
              fi
              echo "Missing expected binary: ${name}"
              exit 1
            fi
            echo "==== ${BIN} ====" | tee -a /tmp/genyconnect-linux-x64-ldd.txt
            ldd "${BIN}" | tee -a /tmp/genyconnect-linux-x64-ldd.txt || true
          done

          if grep -q "not found" /tmp/genyconnect-linux-x64-ldd.txt; then
            grep "not found" /tmp/genyconnect-linux-x64-ldd.txt
            exit 1
          fi

          "${GITHUB_WORKSPACE}/scripts/validate_appimage_contents.sh" squashfs-root "${GITHUB_WORKSPACE}"

          if [[ -f src/xrayconfigbuilder.cpp ]] && grep -q '"mtu"), QJsonArray' src/xrayconfigbuilder.cpp; then
            echo "TUN MTU must be emitted as a JSON number, not an array."
            exit 1
          fi

      - name: Create Linux x64 self-update assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/selfupdate

          SRC="$(find build/final -type f -name "*.AppImage" | head -n 1)"
          test -f "${SRC}"

          OUT="build/selfupdate/GenyConnect-selfupdate-linux-${SELFUPDATE_ARCH}.AppImage"
          cp "${SRC}" "${OUT}"
          (
            cd build/selfupdate
            sha256sum "GenyConnect-selfupdate-linux-${SELFUPDATE_ARCH}.AppImage" \
              > "GenyConnect-selfupdate-linux-${SELFUPDATE_ARCH}.AppImage.sha256"
          )

          ls -lah build/selfupdate

      - name: Collect Linux x64 packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find build/final -type f -name "*.AppImage" -exec cp {} artifacts/ \; || true
          find build/final -type f -name "*.AppImage.sha256" -exec cp {} artifacts/ \; || true
          find build/final -type f -name "*.rpm" -exec cp {} artifacts/ \; || true
          find build/selfupdate -type f -name "GenyConnect-selfupdate-*" -exec cp {} artifacts/ \; || true

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No Linux x64 artifacts found."
            find build -maxdepth 8 -type f | sort | tail -300
            exit 1
          fi

          ls -lah artifacts

      - name: Upload Linux x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenyConnect-linux-x86_64
          path: artifacts/*

  linux-arm64:
    name: Build GenyConnect-linux-arm64
    runs-on: ubuntu-24.04-arm

    env:
      QT_VERSION: "6.11.0"
      TARGET_ARCH: arm64
      APPIMAGE_ARCH: aarch64
      SELFUPDATE_ARCH: arm64
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Prepare Linux ARM64 toolchain
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            locales rpm \
            python3 python3-pip python3-venv imagemagick \
            wget curl gnupg lsb-release software-properties-common ca-certificates \
            unzip zip p7zip-full file tar gzip patchelf desktop-file-utils fakeroot fuse libfuse2 \
            libgl1 libgl1-mesa-dev libegl1 libegl1-mesa-dev \
            libxkbcommon0 libxkbcommon-dev libxkbcommon-x11-0 libxkbcommon-x11-dev \
            libxcb1 libxcb1-dev libxcb-cursor0 libxcb-cursor-dev libxcb-icccm4 libxcb-icccm4-dev \
            libxcb-image0 libxcb-image0-dev libxcb-keysyms1 libxcb-keysyms1-dev \
            libxcb-render-util0 libxcb-render-util0-dev libxcb-shape0 libxcb-shape0-dev \
            libxcb-xfixes0 libxcb-xfixes0-dev libfontconfig1 libfontconfig1-dev \
            libfreetype6 libfreetype6-dev libglib2.0-0 libglib2.0-dev \
            libharfbuzz0b libharfbuzz-dev libpng16-16 libpng-dev zsync

          sudo locale-gen C.UTF-8 || true
          sudo update-locale LANG=C.UTF-8 || true

          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 18

          sudo apt-get install -y clang-18 clang-tools-18 lld-18 llvm-18 ninja-build

          echo "CC=/usr/bin/clang-18" >> "$GITHUB_ENV"
          echo "CXX=/usr/bin/clang++-18" >> "$GITHUB_ENV"
          echo "CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-18" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Qt Linux ARM64
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user aqtinstall

          export PATH="${HOME}/.local/bin:${PATH}"

          aqt list-qt linux_arm64 desktop || true
          aqt list-qt linux_arm64 desktop --modules "${QT_VERSION}" linux_gcc_arm64 || true

          aqt install-qt linux_arm64 desktop "${QT_VERSION}" linux_gcc_arm64 -O "${HOME}/Qt"

          QT_CONFIG="$(find "${HOME}/Qt" -type f -path "*/lib/cmake/Qt6/Qt6Config.cmake" | head -n 1)"

          if [[ -z "${QT_CONFIG}" || ! -f "${QT_CONFIG}" ]]; then
            echo "Qt ARM64 install failed."
            find "${HOME}/Qt" -maxdepth 6 -type f | sort || true
            exit 1
          fi

          QT_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "${QT_CONFIG}")")")")"

          echo "QT_ROOT_DIR=${QT_ROOT}" >> "$GITHUB_ENV"
          echo "${QT_ROOT}/bin" >> "$GITHUB_PATH"

          echo "Qt ARM64 installed at: ${QT_ROOT}"

      - name: Configure Linux ARM64
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DQt6_DIR="${QT_ROOT_DIR}/lib/cmake/Qt6" \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="${CLANG_SCAN_DEPS}" \
            -DGENYCONNECT_USE_MODULES=ON \
            -DGENYCONNECT_LLVM_AUTO_SCAN=ON \
            -DGENYCONNECT_TARGET_OS=linux \
            -DGENYCONNECT_TARGET_ARCH="${TARGET_ARCH}" \
            -DGENYCONNECT_TARGET_BUILD_ARCH="${TARGET_ARCH}" \
            -DGENYCONNECT_LINUX_INSTALL_DEPLOY=OFF

      - name: Build Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --parallel

      - name: Create and verify Linux ARM64 RPM
        shell: bash
        run: |
          set -euo pipefail

          cpack --config build/CPackConfig.cmake -G RPM
          RPM_PACKAGE="$(find "build/final/linux-${TARGET_ARCH}" -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "${RPM_PACKAGE}"
          test -f "${RPM_PACKAGE}"

          rpm -qip "${RPM_PACKAGE}"
          rpm -qpl "${RPM_PACKAGE}" | tee /tmp/genyconnect-rpm-files.txt
          for required_path in \
            /usr/bin/GenyConnect \
            /usr/bin/GenyConnectUpdater \
            /usr/bin/GenyConnectTunHelper \
            /usr/bin/xray-core \
            /usr/share/applications/genyconnect.desktop \
            /usr/share/icons/hicolor/512x512/apps/genyconnect.png; do
            grep -Fqx "${required_path}" /tmp/genyconnect-rpm-files.txt
          done

      - name: Create Linux ARM64 AppImage
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E 'project\(\$\{PROJECT_NAME\} VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi

          OUT_DIR="build/final/linux-${TARGET_ARCH}"
          mkdir -p "${OUT_DIR}"

          rm -rf AppDir tools
          mkdir -p AppDir tools

          DESTDIR="${PWD}/AppDir" cmake --install build --config Release --prefix /usr

          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps

          if [[ ! -f AppDir/usr/share/applications/genyconnect.desktop ]]; then
            printf '%s\n' \
              '[Desktop Entry]' \
              'Type=Application' \
              'Name=GenyConnect' \
              'Comment=GenyConnect VPN Client' \
              'Exec=GenyConnect' \
              'Icon=genyconnect' \
              'Terminal=false' \
              'Categories=Network;Qt;' \
              > AppDir/usr/share/applications/genyconnect.desktop
          fi

          if [[ -f ui/Resources/image/GenyConnect.png ]]; then
            if command -v magick >/dev/null 2>&1; then
              magick ui/Resources/image/GenyConnect.png -resize 512x512! AppDir/usr/share/icons/hicolor/512x512/apps/genyconnect.png
            else
              convert ui/Resources/image/GenyConnect.png -resize 512x512! AppDir/usr/share/icons/hicolor/512x512/apps/genyconnect.png
            fi
          fi

          chmod +x AppDir/usr/bin/GenyConnect || true
          chmod +x AppDir/usr/bin/GenyConnectTunHelper || true
          chmod +x AppDir/usr/bin/GenyConnectUpdater || true
          chmod +x AppDir/usr/bin/xray-core || true

          wget -O tools/linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${APPIMAGE_ARCH}.AppImage"
          wget -O tools/linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${APPIMAGE_ARCH}.AppImage"

          chmod +x tools/linuxdeploy.AppImage tools/linuxdeploy-plugin-qt.AppImage

          QMAKE_BIN="${QT_ROOT_DIR}/bin/qmake6"
          if [[ ! -x "${QMAKE_BIN}" ]]; then
            QMAKE_BIN="${QT_ROOT_DIR}/bin/qmake"
          fi
          if [[ ! -x "${QMAKE_BIN}" ]]; then
            echo "qmake/qmake6 not found."
            find "${QT_ROOT_DIR}" -type f \( -name qmake6 -o -name qmake \) || true
            exit 1
          fi

          QT_PREFIX="$("${QMAKE_BIN}" -query QT_INSTALL_PREFIX)"
          QT_LIB_DIR="$("${QMAKE_BIN}" -query QT_INSTALL_LIBS)"
          QT_PLUGIN_DIR="$("${QMAKE_BIN}" -query QT_INSTALL_PLUGINS)"
          export LD_LIBRARY_PATH="${QT_LIB_DIR}:${QT_PREFIX}/lib:${LD_LIBRARY_PATH:-}"

          mkdir -p AppDir/usr/plugins/platforms AppDir/usr/plugins/imageformats
          cp -av "${QT_PLUGIN_DIR}/platforms/libqxcb.so" AppDir/usr/plugins/platforms/ || true
          cp -av "${QT_PLUGIN_DIR}"/platforms/libqwayland*.so AppDir/usr/plugins/platforms/ || true
          cp -av "${QT_PLUGIN_DIR}/imageformats/libqsvg.so" AppDir/usr/plugins/imageformats/ || true

          if [[ ! -f "AppDir/usr/plugins/platforms/libqxcb.so" ]]; then
            echo "ERROR: Qt xcb platform plugin is required but was not found under ${QT_PLUGIN_DIR}/platforms."
            find "${QT_PLUGIN_DIR}/platforms" -maxdepth 1 -type f -print || true
            exit 1
          fi

          if ! compgen -G "AppDir/usr/plugins/platforms/libqwayland*.so" >/dev/null; then
            echo "WARNING: Qt Wayland platform plugins were not found under ${QT_PLUGIN_DIR}/platforms."
            echo "Continuing with xcb-only AppImage for this architecture."
            find "${QT_PLUGIN_DIR}/platforms" -maxdepth 1 -type f -print || true
          fi

          export QMAKE="${QMAKE_BIN}"
          export QML_SOURCES_PATHS="${PWD}/ui"
          export EXTRA_QT_PLUGINS="platforms/libqxcb.so,platforms/libqwayland-egl.so,platforms/libqwayland-generic.so,imageformats/libqsvg.so"
          export OUTPUT="GenyConnect-${VERSION}-linux-${TARGET_ARCH}.AppImage"
          export APPIMAGE_EXTRACT_AND_RUN=1

          ./tools/linuxdeploy.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/genyconnect.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/genyconnect.png \
            --plugin qt \
            --output appimage

          test -f "${OUTPUT}"
          mv "${OUTPUT}" "${OUT_DIR}/${OUTPUT}"
          (
            cd "${OUT_DIR}"
            sha256sum "GenyConnect-${VERSION}-linux-${TARGET_ARCH}.AppImage" \
              > "GenyConnect-${VERSION}-linux-${TARGET_ARCH}.AppImage.sha256"
          )

          ls -lah "${OUT_DIR}"

      - name: Verify Linux ARM64 AppImage
        shell: bash
        run: |
          set -euo pipefail

          APPIMAGE="$(find build/final -type f -name "*.AppImage" | head -n 1)"
          test -f "${APPIMAGE}"
          chmod +x "${APPIMAGE}"

          rm -rf /tmp/genyconnect-appimage-check
          mkdir -p /tmp/genyconnect-appimage-check
          cp "${APPIMAGE}" /tmp/genyconnect-appimage-check/
          cd /tmp/genyconnect-appimage-check

          "./$(basename "${APPIMAGE}")" --appimage-extract >/dev/null

          : > /tmp/genyconnect-linux-arm64-ldd.txt
          for name in GenyConnect GenyConnectTunHelper GenyConnectUpdater xray-core; do
            BIN="$(find squashfs-root -type f -name "${name}" | head -n 1 || true)"
            if [[ -z "${BIN}" ]]; then
              if [[ "${name}" == "xray-core" ]]; then
                continue
              fi
              echo "Missing expected binary: ${name}"
              exit 1
            fi
            echo "==== ${BIN} ====" | tee -a /tmp/genyconnect-linux-arm64-ldd.txt
            ldd "${BIN}" | tee -a /tmp/genyconnect-linux-arm64-ldd.txt || true
          done

          if grep -q "not found" /tmp/genyconnect-linux-arm64-ldd.txt; then
            grep "not found" /tmp/genyconnect-linux-arm64-ldd.txt
            exit 1
          fi

          "${GITHUB_WORKSPACE}/scripts/validate_appimage_contents.sh" squashfs-root "${GITHUB_WORKSPACE}"

          if [[ -f src/xrayconfigbuilder.cpp ]] && grep -q '"mtu"), QJsonArray' src/xrayconfigbuilder.cpp; then
            echo "TUN MTU must be emitted as a JSON number, not an array."
            exit 1
          fi

      - name: Create Linux ARM64 self-update assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/selfupdate

          SRC="$(find build/final -type f -name "*.AppImage" | head -n 1)"
          test -f "${SRC}"

          OUT="build/selfupdate/GenyConnect-selfupdate-linux-${SELFUPDATE_ARCH}.AppImage"
          cp "${SRC}" "${OUT}"
          (
            cd build/selfupdate
            sha256sum "GenyConnect-selfupdate-linux-${SELFUPDATE_ARCH}.AppImage" \
              > "GenyConnect-selfupdate-linux-${SELFUPDATE_ARCH}.AppImage.sha256"
          )

          ls -lah build/selfupdate

      - name: Collect Linux ARM64 packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find build/final -type f -name "*.AppImage" -exec cp {} artifacts/ \; || true
          find build/final -type f -name "*.AppImage.sha256" -exec cp {} artifacts/ \; || true
          find build/final -type f -name "*.rpm" -exec cp {} artifacts/ \; || true
          find build/selfupdate -type f -name "GenyConnect-selfupdate-*" -exec cp {} artifacts/ \; || true

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No Linux ARM64 artifacts found."
            find build -maxdepth 8 -type f | sort | tail -300
            exit 1
          fi

          ls -lah artifacts

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenyConnect-linux-arm64
          path: artifacts/*

  nix:
    name: Build GenyConnect Nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate flake
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --no-build --print-build-logs

      - name: Build Nix package
        shell: bash
        run: |
          set -euo pipefail
          nix build ".#packages.${{ matrix.system }}.default" --print-build-logs
          test -x result/bin/GenyConnect
          test -x result/bin/GenyConnectUpdater
          test -x result/bin/GenyConnectTunHelper
          test -x result/bin/xray-core
          result/bin/xray-core version

  android:
    name: Build GenyConnect-android-${{ matrix.android_output_arch }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_arch: android_arm64_v8a
            android_abi: arm64-v8a
            android_output_arch: arm64-v8a
            target_arch: arm64
            selfupdate_arch: arm64

          - qt_arch: android_armv7
            android_abi: armeabi-v7a
            android_output_arch: armeabi-v7a
            target_arch: armv7
            selfupdate_arch: armv7

    env:
      QT_VERSION: "6.11.0"
      ANDROID_API: "28"
      ANDROID_DEPLOY_PLATFORM: "36"
      ANDROID_NDK_VERSION: "27.2.12479018"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Android SDK paths
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Install Android SDK and NDK packages
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${ANDROID_SDK_ROOT}/.temp" || true
          rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest/.temp" || true

          sdkmanager --licenses <<EOF >/dev/null 2>&1 || true
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "platforms;android-${ANDROID_DEPLOY_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Save Qt Android and host paths
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_QT_ROOT=${QT_ROOT_DIR}" >> "${GITHUB_ENV}"
          echo "QT_HOST_ROOT=$(dirname "${QT_ROOT_DIR}")/gcc_64" >> "${GITHUB_ENV}"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            unzip \
            zip \
            p7zip-full \
            curl \
            file \
            git

      - name: Prepare Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" || -z "${ANDROID_KEY_PASSWORD}" ]]; then
            echo "Android signing secrets are incomplete."
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/android-signing"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-signing/release.keystore"
          test -s "${RUNNER_TEMP}/android-signing/release.keystore"

          echo "QT_ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/android-signing/release.keystore" >> "${GITHUB_ENV}"
          echo "QT_ANDROID_KEYSTORE_ALIAS=${ANDROID_KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "QT_ANDROID_KEYSTORE_STORE_PASS=${ANDROID_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "QT_ANDROID_KEYSTORE_KEY_PASS=${ANDROID_KEY_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Configure Android module scanner
        shell: bash
        run: |
          set -euo pipefail

          SCAN_DEPS="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang-scan-deps"

          if [[ ! -x "${SCAN_DEPS}" ]]; then
            echo "clang-scan-deps not found: ${SCAN_DEPS}"
            find "${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f | sort
            exit 1
          fi

          echo "CLANG_SCAN_DEPS=${SCAN_DEPS}" >> "${GITHUB_ENV}"

      - name: Configure Android Release
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ANDROID_QT_ROOT}" \
            -DQt6_DIR="${ANDROID_QT_ROOT}/lib/cmake/Qt6" \
            -DQT_HOST_PATH="${QT_HOST_ROOT}" \
            -DQT_HOST_PATH_CMAKE_DIR="${QT_HOST_ROOT}/lib/cmake" \
            -DQT_ANDROID_BUILD_TYPE=Release \
            -DQT_ANDROID_DEPLOY_RELEASE=ON \
            -DQT_ANDROID_SIGN_APK=ON \
            -DQT_ANDROID_KEYSTORE_PATH="${QT_ANDROID_KEYSTORE_PATH}" \
            -DQT_ANDROID_KEYSTORE_ALIAS="${QT_ANDROID_KEYSTORE_ALIAS}" \
            -DQT_ANDROID_KEYSTORE_STORE_PASS="${QT_ANDROID_KEYSTORE_STORE_PASS}" \
            -DQT_ANDROID_KEYSTORE_KEY_PASS="${QT_ANDROID_KEYSTORE_KEY_PASS}" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_QT_ROOT}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_SCAN_FOR_MODULES=ON \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="${CLANG_SCAN_DEPS}" \
            -DANDROID_ABI="${{ matrix.android_abi }}" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK="${ANDROID_NDK_ROOT}" \
            -DCMAKE_ANDROID_NDK="${ANDROID_NDK_ROOT}" \
            -DQT_ANDROID_ABIS="${{ matrix.android_abi }}" \
            -DGENYCONNECT_BUILD_DESKTOP=OFF \
            -DGENYCONNECT_BUILD_ANDROID=ON \
            -DGENYCONNECT_ENABLE_MOBILE_VPN=ON \
            -DGENYCONNECT_AUTO_DOWNLOAD_XRAY=ON \
            -DGENYCONNECT_AUTO_BUILD_ANDROID_ARMV7_XRAY=ON \
            -DGENYCONNECT_USE_MODULES=ON \
            -DGENYCONNECT_TARGET_OS=android \
            -DGENYCONNECT_TARGET_ARCH="${{ matrix.target_arch }}" \
            -DGENYCONNECT_TARGET_BUILD_ARCH="${{ matrix.target_arch }}"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target apk --parallel

      - name: Normalize Android artifact names
        shell: bash
        run: |
          set -euo pipefail

          OUT_DIR="build/final/android-${{ matrix.android_output_arch }}"
          mkdir -p "${OUT_DIR}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(grep -E 'project\(\$\{PROJECT_NAME\} VERSION ' CMakeLists.txt | sed -E 's/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          fi

          APK="$(find build -type f \( -name "*release*.apk" -o -name "*.apk" \) | grep -vi debug | sort | head -n 1)"

          if [[ -z "${APK}" || ! -f "${APK}" ]]; then
            echo "No Android APK found."
            find build -maxdepth 10 -type f | sort | tail -300
            exit 1
          fi

          cp "${APK}" "${OUT_DIR}/GenyConnect-${VERSION}-android-${{ matrix.android_output_arch }}.apk"
          cp "${APK}" "${OUT_DIR}/GenyConnect-selfupdate-android-${{ matrix.selfupdate_arch }}.apk"

          (
            cd "${OUT_DIR}"
            sha256sum "GenyConnect-selfupdate-android-${{ matrix.selfupdate_arch }}.apk" \
              > "GenyConnect-selfupdate-android-${{ matrix.selfupdate_arch }}.apk.sha256"
          )

          ls -lah "${OUT_DIR}"

      - name: Collect Android packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find build/final -type f -name "*.apk" -exec cp {} artifacts/ \;
          find build/final -type f -name "*.apk.sha256" -exec cp {} artifacts/ \;

          if [ -z "$(find artifacts -type f -print -quit)" ]; then
            echo "No Android artifacts found."
            find build -maxdepth 10 -type f | sort | tail -300
            exit 1
          fi

          ls -lah artifacts

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenyConnect-android-${{ matrix.android_output_arch }}
          path: artifacts/*

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - desktop
      - linux-x64
      - linux-arm64
      - nix
      - android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List release files
        shell: bash
        run: |
          set -euo pipefail
          find release-artifacts -type f | sort

      - name: Delete existing manual release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "${GITHUB_REF_NAME}" --cleanup-tag=false --yes || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: GenyConnect ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: release-artifacts/*
          fail_on_unmatched_files: true
