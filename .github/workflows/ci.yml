name: GenyConnect Android CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CMAKE_VERSION: "4.2.3"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  android:
    name: Build android-arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-26" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;26.3.11579264"

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: android
          arch: android_arm64_v8a
          cache: true

      - name: Save Qt paths
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_QT_ROOT=${QT_ROOT_DIR}" >> "$GITHUB_ENV"
          echo "QT_HOST_ROOT=$(dirname "${QT_ROOT_DIR}")/gcc_64" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.CMAKE_VERSION }}

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build unzip zip p7zip-full curl file

      - name: Configure Android
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${ANDROID_QT_ROOT}" \
            -DQt6_DIR="${ANDROID_QT_ROOT}/lib/cmake/Qt6" \
            -DQT_HOST_PATH="${QT_HOST_ROOT}" \
            -DQT_HOST_PATH_CMAKE_DIR="${QT_HOST_ROOT}/lib/cmake" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_QT_ROOT}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_ABI="arm64-v8a" \
            -DANDROID_PLATFORM="android-26" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DQT_ANDROID_ABIS="arm64-v8a" \
            -DCMAKE_CXX_SCAN_FOR_MODULES=ON \
            -DGENYCONNECT_BUILD_DESKTOP=OFF \
            -DGENYCONNECT_BUILD_ANDROID=ON \
            -DGENYCONNECT_ENABLE_MOBILE_VPN=ON \
            -DGENYCONNECT_AUTO_DOWNLOAD_XRAY=ON \
            -DGENYCONNECT_USE_MODULES=ON \
            -DGENYCONNECT_TARGET_OS=android \
            -DGENYCONNECT_TARGET_ARCH="arm64" \
            -DGENYCONNECT_TARGET_BUILD_ARCH="arm64"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target apk --parallel

      - name: Build Android AAB
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target aab --parallel

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build -type f -name "*.apk" -exec cp {} artifacts/ \;
          find build -type f -name "*.aab" -exec cp {} artifacts/ \;
          ls -lah artifacts

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenyConnect-android-arm64-v8a
          path: artifacts/*